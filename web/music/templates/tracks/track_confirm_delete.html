{% extends 'base.html' %}

{% block title %}Удаление трека{% endblock %}

{% block content %}
<div class="form-container delete-container">
    <h1 style="color: #ff6b6b;">🗑 Удалить трек?</h1>
    
    <div class="track-cover" style="width: 200px; margin: 1rem auto;">
        {% if track.cover %}
            <img src="{{ track.cover.url }}" alt="{{ track.title }}">
        {% else %}
            <div style="height: 200px; display: flex; align-items: center; justify-content: center; font-size: 3rem;">🎵</div>
        {% endif %}
    </div>
    
    <p style="font-size: 1.5rem; margin: 1rem 0;">{{ track.artist }} - {{ track.title }}</p>
    <p style="color: #ff6b6b; margin-bottom: 2rem;">Это действие нельзя отменить!</p>
    
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button type="submit" class="btn btn-danger">✅ Да, удалить</button>
            <a href="{% url 'music:track_detail' track.pk %}" class="btn btn-secondary">❌ Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
