{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <h1 style="text-align: center; margin-bottom: 45px; font-weight: 950; letter-spacing: -1px;">ВХОД В PULSE</h1>
    
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    {% for error in field.errors %}
                        <p style="color: var(--accent); font-size: 11px; margin-top: 8px; font-weight: 800;">! {{ error }}</p>
                    {% endfor %}
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="btn-pulse" style="margin-top: 20px;">ВОЙТИ</button>
    </form>
    
    <div style="text-align: center; margin-top: 35px; border-top: 1px solid var(--glass-border); padding-top: 25px;">
        <p style="color: var(--text-muted); font-size: 14px; font-weight: 600;">
            Нет аккаунта? 
            <a href="{% url 'music:registration_page' %}" style="color: var(--accent); text-decoration: none; margin-left: 5px;">СОЗДАТЬ</a>
        </p>
    </div>
</div>
{% endblock %}
